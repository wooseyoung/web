/* cover */
.cover{position:absolute;inset:0;background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 .25em,transparent .25em .5em),var(--cover);
  border-radius:0 .35em .35em 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold);padding:3em;text-align:center;
  box-shadow:inset .8em 0 1.2em -1em rgba(0,0,0,.6)}
.cover::before{content:"";position:absolute;inset:1.4em;border:.12em solid rgba(242,212,138,.75);border-radius:.4em;box-shadow:inset 0 0 0 .4em transparent, inset 0 0 0 .52em rgba(242,212,138,.4)}
.cover h2{font-size:3em;margin:0;font-weight:700;line-height:1.2;text-shadow:0 .06em 0 rgba(0,0,0,.35)}
.cover .oval{width:15em;height:15em;border-radius:50%;background:var(--paper);margin:1.6em 0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;box-shadow:0 0 0 .3em rgba(242,212,138,.85)}
.cover .oval .duo{transform:scale(.62);transform-origin:50% 100%;margin:0 0 .6em}
.cover .oval svg{width:60%;margin-bottom:22%}
.cover small{font-size:1em;opacity:.85}
.cover.art{background:#f4eddd;padding:0;border-radius:.12em .4em .4em .12em;overflow:hidden}
.cover.art::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    linear-gradient(90deg,rgba(95,65,35,.30) 0,rgba(95,65,35,.10) 1.3%,rgba(255,252,240,.55) 2.3%,rgba(95,65,35,.20) 3.5%,rgba(95,65,35,.05) 4.8%,transparent 7.5%),
    linear-gradient(118deg,rgba(255,255,255,.22) 0,transparent 38%,transparent 62%,rgba(90,60,25,.10) 100%),
    repeating-linear-gradient(0deg,rgba(125,100,65,.055) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(125,100,65,.045) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 0 .07em rgba(130,100,60,.28),inset -.35em 0 .7em rgba(90,60,25,.10),inset 0 -.3em .6em rgba(90,60,25,.08)}
.cover.art::before{display:none}
.cover.art img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;display:block}

/* flipping */
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.half.at-L{left:0}.half.at-R{left:50%}
.half > .spread{width:200%;right:auto}
.half.show-L > .spread{left:0}
.half.show-R > .spread{left:-100%}
.flipper{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:5;pointer-events:none}
.flipper.fwd{left:50%;transform-origin:0 50%}
.flipper.bwd{left:0;transform-origin:100% 50%}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face .half{width:100%;left:0}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.flipper.fwd .face.front .shade{background:linear-gradient(90deg,rgba(40,25,10,.35),rgba(40,25,10,.05))}
.flipper.fwd .face.back .shade{background:linear-gradient(270deg,rgba(40,25,10,.35),rgba(40,25,10,.05))}
.flipper.bwd .face.front .shade{background:linear-gradient(270deg,rgba(40,25,10,.35),rgba(40,25,10,.05))}
.flipper.bwd .face.back .shade{background:linear-gradient(90deg,rgba(40,25,10,.35),rgba(40,25,10,.05))}
.static-half{z-index:4;pointer-events:none;transform:translateZ(0)}
.flipper{will-change:transform}
.face,.static-half{contain:paint}
.flipper *,.static-half *,.flip-cover *{animation-play-state:paused!important;transition:none!important;mix-blend-mode:normal!important}
.flipper .fx,.static-half .fx,.flipper .ff,.static-half .ff,.flipper .ember,.flipper .fp,.static-half .fp{display:none!important}
.flip-cover{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-style:preserve-3d;transform-origin:0 50%;z-index:6}
.flip-cover .face.back .endpaper{border-radius:.35em 0 0 .35em}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .leaf,.ff{display:none}
}

const VINES=[];
[["img/aa0d1e62dff7.webp",18,5,385,'l'],["img/0af5e63ddecc.webp",1331,11,316,'r']].forEach(([src,x,y,w,side])=>{

  stage.appendChild(wrap);
  const v={wrap,img,a:0,va:0,alpha:null,w:0,h:0}; VINES.push(v);
  img.onload=()=>{const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; const g=c.getContext('2d'); g.drawImage(img,0,0);
    v.alpha=g.getImageData(0,0,c.width,c.height).data; v.w=c.width; v.h=c.height};
});
function vineAt(cx,cy){
  for(const v of VINES){ if(!v.alpha) continue; const r=v.img.getBoundingClientRect();
    if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom) continue;
    const px=Math.floor((cx-r.left)/r.width*v.w), py=Math.floor((cy-r.top)/r.height*v.h);
    // be generous: look in a small neighbourhood so thin stems are easy to catch
    for(let dy=-6;dy<=6;dy+=3) for(let dx=-6;dx<=6;dx+=3){ const X=px+dx, Y=py+dy; if(X<0||Y<0||X>=v.w||Y>=v.h) continue;
      if(v.alpha[(Y*v.w+X)*4+3]>40) return {v,depth:(cy-r.top)/r.height} }
  }
  return null;
}
function pushVine(hit,force){ hit.v.va+=Math.max(-1.2,Math.min(1.2,force))*(0.3+hit.depth*.7); kickVines() }
let vineRAF=0;
function kickVines(){ if(!vineRAF) vineRAF=requestAnimationFrame(stepVines) }
function stepVines(){
  vineRAF=0; let moving=false;
  VINES.forEach(v=>{ v.va+=-0.05*v.a; v.va*=0.9; v.a+=v.va; v.a=Math.max(-3.5,Math.min(3.5,v.a));
    v.wrap.style.transform=`skewX(${v.a.toFixed(3)}deg)`; if(Math.abs(v.a)>.02||Math.abs(v.va)>.02) moving=true; });
  if(moving) kickVines();
}

function footTrail(pts){
  const P=pts.map(([x,y])=>[x*16.72,y*9.41]); let L=[0];
  for(let i=1;i<P.length;i++) L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  const at=d=>{let i=1;while(i<P.length-1&&L[i]<d)i++;const t=(d-L[i-1])/(L[i]-L[i-1]);return[P[i-1][0]+(P[i][0]-P[i-1][0])*t,P[i-1][1]+(P[i][1]-P[i-1][1])*t,P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]]};
  return FOOT.map(([f,src,off,w],k)=>{
    let [x,y,dx,dy]=at(L[L.length-1]*f*.99); const len=Math.hypot(dx,dy);

  }).join('');
}

const RPATH=[[60.5,71.2],[63,69],[66,67.4],[69,66.1],[72,64.6],[75,62.5],[78,60.1],[80,57.4],[81.2,55.4],[81.4,53.6],[81,52.2],[81.3,50.7],[82.4,49.4]];
function footTrail3(){
  const P=RPATH.map(([x,y])=>[x*16.72,y*9.41]); const L=[0];
  for(let i=1;i<P.length;i++) L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  const at=d=>{let i=1;while(i<P.length-1&&L[i]<d)i++;const t=Math.min(1,(d-L[i-1])/(L[i]-L[i-1]));return[P[i-1][0]+(P[i][0]-P[i-1][0])*t,P[i-1][1]+(P[i][1]-P[i-1][1])*t,P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]]};
  let d=0,k=0,h='';

    d+=w*16.72*2.4; k++;

}

function bellChime(){

    // [ratio to prime, level, decay seconds, beat Hz] — hum, prime, tierce, quint, nominal and the upper bronze partials
    [[.5,.30,9,.35],[1,.34,7,.6],[1.2,.20,5.5,.9],[1.5,.10,4,.7],[2,.26,4.5,1.1],[2.5,.08,3,1.3],[2.67,.07,2.6,1.6],[3,.06,2.2,1.4],[4.07,.05,1.4,2],[5.2,.03,.9,2.4],[6.3,.02,.6,3]].forEach(([r,v,d,bt])=>{

}

const GH_GAPS=[9,39,69],GH_FIXED=[[0,9],[22,39],[52,69],[82,100]];
function ghChannel(complete=false){
 const fragment=(start,end,cls,extra='')=>`<span class="gh-channel-window ${cls}" style="left:${start}%;width:${end-start}%" ${extra}>${ghSprite('channel','',`position:absolute;top:0;left:${-start/(end-start)*100}%;width:${100/(end-start)*100}%;height:100%`)}</span>`;
 return `<div class="gh-channel" aria-label="나무 물길">`+GH_FIXED.map(([a,b])=>fragment(a,b,'')).join('')+
 GH_GAPS.map((a,i)=>`<button class="gh-hole${complete?' filled':''}" ${complete?'disabled':''} data-act="gh-hole" data-slot="${i}" aria-label="물길의 ${i+1}번째 빈 홈" aria-pressed="${complete}" style="left:${a}%;width:13%">${ghSprite('channel','gh-channel-patch',`position:absolute;top:0;left:${-a/13*100}%;width:${100/13*100}%;height:100%`)}</button>`).join('')+`</div>`;
}
function ghPlants(alive=false){return [44,62,80].map((x,i)=>`<span class="gh-plant" style="left:${x}%;--gh-delay:${i*.3}s">${ghSprite('dry','gh-dry','position:absolute;inset:0;width:100%;height:100%')}${ghSprite('alive','gh-alive','position:absolute;inset:0;width:100%;height:100%;'+(alive?'opacity:1':''))}</span>`).join('')}
function ghWaterLines(){return `<svg class="gh-water-lines" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><path class="gh-stream-main" d="M932 220 V244 H480"/><path class="gh-stream-drop d0" d="M485 265 V340"/><path class="gh-stream-drop d1" d="M665 265 V340"/><path class="gh-stream-drop d2" d="M845 265 V340"/></svg>`}
function ghGreenhouse(mode){
 const C=state.choice, solved=mode!=='repair'||!!C.ghWater, alive=mode==='gift'||!!C.ghBloom;
 return `<div class="jr-greenhouse gh-${mode}${solved?' repaired flowing':''}${alive?' blooming':''}" data-selected="">`+
 ghChannel(solved)+ghPlants(alive)+ghWaterLines()+
 `<button class="gh-valve${solved?' open':''}" data-act="gh-valve" aria-label="물길 밸브 돌리기" aria-pressed="${solved}">${ghSprite('valve')}</button>`+
 ghChar(mode==='gift'?'jack_garden_offer_basket':mode==='recover'?'jack_garden_happy':'jack_base_stand','gh-garden-jack','left:8%;bottom:6%;height:46.5%')+
 (mode==='repair'&&!solved?[0,1,2].map((i)=>`<button class="gh-piece gh-draggable" data-act="gh-piece" data-piece="${i}" aria-label="나무 조각 ${i+1} 집기" aria-pressed="false" style="left:${27+i*14}%;bottom:4%">${ghSprite('piece'+i)}</button>`).join(''):'')+
 (mode==='recover'?`<button class="gh-hotspot gh-bloom-target" data-act="gh-bloom" aria-label="콩나무 돌보기"><span>${alive?'건강하게 자란 콩나무':'처진 잎을 살펴보기'}</span></button>`:'')+
 `<p class="gh-status" role="status" aria-live="polite">${mode==='repair'?(solved?'물길이 이어졌어요.': '나무 조각을 홈에 끼운 뒤, 밸브를 돌려 보세요.') :mode==='recover'?(alive?'잎이 다시 고개를 들었어요.':'처진 잎을 눌러 콩나무를 돌봐 주세요.'):'콩깍지를 따서 바구니에 담아 보세요.'}</p></div>`;
}

const jackOriginalPages=pageJack;
pageJack=function(){
 const original=jackOriginalPages().map((p,i)=>({...p,visualPage:i}));
 const shared=original.slice(0,8),gate=ghGate();
 if(state.choice.jrPath==='greenhouse')return [...shared,gate,...ghPages()];
 return [...shared,gate,...original.slice(8)];
};
const ghOriginalRender=render;
render=function(i){
 const p=pagesFor(state.story)[i],el=ghOriginalRender(i);
 if(state.story==='jack'){
  el.dataset.page=p.visualPage??i;el.dataset.jrScene=p.jrScene||'original';
  if(p.kind==='fin'){
   const sub=el.querySelector('.crsub');if(sub)sub.textContent=state.choice.jrPath==='greenhouse'?'구름 위 정원사와 마법의 콩':state.choice.loot==='harp'?'마을에 퍼진 하프 노래':'황금알을 품고 돌아온 잭';
   if(state.choice.jrPath==='greenhouse'){const pic=el.querySelector('.finpic');if(pic)pic.style.backgroundImage=`url(${IMG.k2bg})`;}
  }
 }
 return el;
};
const ghOriginalForget=forgetAfter;
forgetAfter=function(to){
 const pages=state.story==='jack'?pagesFor('jack'):null;ghOriginalForget(to);
 if(!pages)return;
 const gift=pages.findIndex(p=>p.need==='ghGift'),share=pages.findIndex(p=>p.need==='ghShare');
 if(gift<0||to<gift){delete state.choice.ghPods;delete state.choice.ghHarvest;delete state.choice.ghSeeds;}
 if(share<0||to<share)delete state.choice.ghShared;
};

function ghReplaceCurrent(){const old=book.querySelector(':scope > .spread');if(old)old.replaceWith(render(state.page));pageShown();dots();}
function ghFly(ill,el,to,key='pod',duration=700){
 const r=ill.getBoundingClientRect(),b=el.getBoundingClientRect(),dest=to.getBoundingClientRect();
 const span=document.createElement('span');span.className='gh-fly';span.style.cssText=`left:${b.left-r.left}px;top:${b.top-r.top}px;width:${Math.max(24,b.width)}px;`;
 span.innerHTML=ghSprite(key);ill.appendChild(span);
 const px=to.classList.contains('gh-person')?.14:to.classList.contains('gh-garden-jack')?.78:.5;
 const py=to.classList.contains('gh-person')?(to.dataset.person==='2'?.49:.38):to.classList.contains('gh-garden-jack')?.28:to.classList.contains('gh-bag')?.15:.45;
 const dx=dest.left+dest.width*px-b.left-b.width*.5,dy=dest.top+dest.height*py-b.top-b.height*.5;
 span.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.5}px,${dy*.5-45}px) scale(.75)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.35)`,opacity:0}],{duration,easing:'ease-in-out',fill:'forwards'});
 ghTimer(ill,duration,()=>span.remove());
}
function ghPlacePiece(ill,piece,hole){
 if(!piece||!hole||piece.classList.contains('used')||hole.classList.contains('filled'))return;
 piece.classList.add('used');piece.classList.remove('selected');piece.style.translate='';
 hole.classList.add('filled');hole.disabled=true;hole.setAttribute('aria-pressed','true');ill.querySelector('.jr-greenhouse').dataset.selected='';
 const n=ill.querySelectorAll('.gh-hole.filled').length;ghPing();
 ghStatus(ill,n===3?'물길이 모두 이어졌어요. 이제 밸브를 돌려 주세요.':'나무 조각 '+n+'개를 끼웠어요.');
 if(n===3)ill.querySelector('.jr-greenhouse').classList.add('repaired');
}
function ghCollectSeed(ill,seed){
 if(seed.classList.contains('used'))return;
 const id=+seed.dataset.seed, bag=ill.querySelector('.gh-bag');
 ghFly(ill,seed,bag,'seed');seed.classList.add('used');seed.style.translate='';
 const set=state.choice.ghSeeds||(state.choice.ghSeeds=[]);if(!set.includes(id))set.push(id);ghPing();
 ghStatus(ill,`마법 콩 ${set.length}알을 담았어요.`);
 if(set.length===3)ghTimer(ill,750,()=>{bag.innerHTML=ghSprite('bagFull');applyChoice('ghGift','yes',null,0);ghStatus(ill,'마법 콩 세 알을 담았어요. 집으로 돌아가 볼까요?')});
}

Object.assign(JACT,{
 'gh-path'(a,ill){
  if(state.busy||ill._ghRouting)return;ill._ghRouting=true;
  for(const k of ['loot','escape','chase','descend','chop','ghEnter','ghWater','ghBloom','ghGift','ghShare','ghPods','ghHarvest','ghSeeds','ghShared'])delete state.choice[k];
  applyChoice('jrPath',a.dataset.v,null,0);dots();ghPing();
  a.classList.add('chosen');ghTimer(ill,850,()=>go(state.page+1));
 },
 'gh-enter'(a,ill){if(state.choice.ghEnter)return;a.classList.add('chosen');try{creak()}catch(e){}applyChoice('ghEnter','yes',null,0);ghTimer(ill,700,()=>go(state.page+1));},
 'gh-piece'(a,ill){if(a._ghSuppress||a.classList.contains('used'))return;const selected=!a.classList.contains('selected');ill.querySelectorAll('.gh-piece').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});a.classList.toggle('selected',selected);a.setAttribute('aria-pressed',String(selected));ill.querySelector('.jr-greenhouse').dataset.selected=selected?a.dataset.piece:'';ghStatus(ill,selected?'빈 홈을 누르거나, 조각을 끌어 끼워 주세요.':'나무 조각을 집어 주세요.');},
 'gh-hole'(a,ill){const piece=ill.querySelector('.gh-piece.selected');if(!piece){ghStatus(ill,'아래 나무 조각을 먼저 집어 주세요.');return}ghPlacePiece(ill,piece,a);},
 'gh-valve'(a,ill){
  if(state.choice.ghWater)return;
  if(ill.querySelectorAll('.gh-hole.filled').length<3){ghStatus(ill,'아직 빈 홈이 있어요. 물길부터 이어 주세요.');ill.querySelectorAll('.gh-hole:not(.filled)').forEach(x=>x.animate([{opacity:1},{opacity:.25},{opacity:1}],{duration:550}));return}
  if(ill._ghWater)return;ill._ghWater=true;a.classList.add('open');a.setAttribute('aria-pressed','true');ill.querySelector('.jr-greenhouse').classList.add('flowing');try{creak()}catch(e){}
  ghStatus(ill,'쏴아— 물이 화분까지 흘러가요.');ghTimer(ill,1600,()=>applyChoice('ghWater','yes',null,0));
 },
 'gh-bloom'(a,ill){if(state.choice.ghBloom||ill._ghBloom)return;ill._ghBloom=true;ill.querySelector('.jr-greenhouse').classList.add('blooming');ghPing();ghStatus(ill,'잎이 천천히 고개를 들고 있어요.');ghTimer(ill,1800,()=>{applyChoice('ghBloom','yes',null,0);ghStatus(ill,'싱싱한 잎이 활짝 펼쳐졌어요.')});},
 'gh-pod'(a,ill){if(a.classList.contains('used'))return;const set=state.choice.ghPods||(state.choice.ghPods=[]),id=+a.dataset.pod;if(set.includes(id))return;set.push(id);ghFly(ill,a,ill.querySelector('.gh-garden-jack'));a.classList.add('used');ghPing();ghStatus(ill,`콩깍지 ${set.length}개를 수확했어요.`);if(set.length===3)ghTimer(ill,850,()=>{state.choice.ghHarvest='yes';ghReplaceCurrent()});},
 'gh-seed'(a,ill){if(!a._ghSuppress)ghCollectSeed(ill,a);},
 'gh-bag'(a,ill){const seed=ill.querySelector('.gh-seed:not(.used)');if(seed)ghCollectSeed(ill,seed);},
 'gh-share'(a,ill){
  if(a.classList.contains('received'))return;const set=state.choice.ghShared||(state.choice.ghShared=[]),id=+a.dataset.person;if(set.includes(id))return;set.push(id);
  ghFly(ill,ill.querySelector('.gh-food'),a);a.classList.add('received');a.setAttribute('aria-pressed','true');a.insertAdjacentHTML('beforeend',ghSprite('pod','gh-received-pod'));ghPing();
  ghStatus(ill,['엄마에게 콩을 나누었어요.','할아버지에게 콩을 나누었어요.','아이에게 콩을 나누었어요.'][id]);
  if(set.length===3)ghTimer(ill,750,()=>{applyChoice('ghShare','yes',null,0);ghStatus(ill,'나눌수록 풍성해지는 마을이 되었어요.')});
 },
 'gh-share-next'(a,ill){const next=ill.querySelector('.gh-person:not(.received)');if(next)JACT['gh-share'](next,ill);}
});

// Native pointer drag with click/keyboard alternatives for the same actions.
let ghDrag=null;
book.addEventListener('pointerdown',e=>{
 const el=e.target.closest('.gh-draggable');if(!el||state.busy||e.button!==0||el.classList.contains('used'))return;
 e.preventDefault();e.stopPropagation();const ill=el.closest('.ill');ghDrag={el,ill,x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};el.classList.add('held');try{el.setPointerCapture(e.pointerId)}catch(err){}
});
window.addEventListener('pointermove',e=>{
 const d=ghDrag;if(!d||d.id!==e.pointerId)return;if(!d.el.isConnected){ghDrag=null;return}
 const dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.hypot(dx,dy)>5)d.moved=true;if(!d.moved)return;
 d.el.style.translate=`${dx}px ${dy}px`;
 const targets=d.ill.querySelectorAll(d.el.classList.contains('gh-seed')?'.gh-bag':'.gh-hole:not(.filled)');
 targets.forEach(x=>{const b=x.getBoundingClientRect();x.classList.toggle('near',e.clientX>=b.left-12&&e.clientX<=b.right+12&&e.clientY>=b.top-20&&e.clientY<=b.bottom+20)});
});
function ghEndDrag(e,cancel=false){
 const d=ghDrag;if(!d||e.pointerId!==d.id)return;ghDrag=null;d.el.classList.remove('held');

 {kind:'fin',visualPage:205,cwScene:'end'}];}

pageJack=function(){const old=cwPreviousPages();const castle={...old[5],need:'cwPath',cwScene:'fork',text:()=> '콩나무 꼭대기에 오른 잭 앞에 커다란 성이 나타났어요. 성문에서는 고소한 냄새가, 옆 구름길에서는 새의 울음소리가 들려왔어요. 잭은 어디로 가 볼까요?'+(state.choice.cwPath==='cloud'?' <span class="res">잭은 울음소리가 들리는 구름길로 향했어요.</span>':state.choice.cwPath?' <span class="res">잭은 성문을 두드렸어요.</span>':''),fx:()=>{
 const html=old[5].fx().replace('data-act="k6door"','data-act="cw-path" data-path="castle"');
 return html+`<button class="cw-cloud-choice" data-act="cw-path" data-path="cloud" aria-label="성 옆 구름길로 가기">${cwImg(IMG.cwBird,'')}</button>`;
 }};
 if(state.choice.cwPath==='cloud')return [...old.slice(0,5),castle,...cwPages()];
 return [...old.slice(0,5),castle,...old.slice(6)];};
const cwOldRender=render;
render=function(i){const el=cwOldRender(i);if(state.story==='jack'){const p=pagesFor('jack')[i];if(p.cwScene)el.dataset.cwScene=p.cwScene;if(p.cwScene==='end'){
 const sub=el.querySelector('.crsub');if(sub)sub.textContent='구름새와 비를 부르는 씨앗';const pic=el.querySelector('.finpic');if(pic)pic.style.backgroundImage=`url(${IMG.k2bg})`;
 }}return el;};
const cwOldForget=forgetAfter;
forgetAfter=function(to){cwOldForget(to);if(state.story!=='jack')return;const pages=pagesFor('jack');if(to<pages.findIndex(p=>p.need==='cwBridge')){delete state.choice.cwFilled;delete state.choice.cwUsed;}if(to<pages.findIndex(p=>p.need==='cwSeeds'))delete state.choice.cwFound;if(to<5){delete state.choice.cwPath;delete state.choice.cwFilled;delete state.choice.cwUsed;delete state.choice.cwFound;CW_KEYS.forEach(k=>delete state.choice[k]);}};
function cwRefresh(){const old=book.querySelector(':scope > .spread');if(old)old.replaceWith(render(state.page));pageShown();dots();}
function cwDrop(ill,piece,slot){if(!piece||!slot||slot.disabled||piece.classList.contains('used'))return;const id=+piece.dataset.piece,idx=+slot.dataset.slot;const filled=state.choice.cwFilled||(state.choice.cwFilled=[]);if(filled.includes(idx))return; // Any cloud fits any empty gap; piece usage is tracked separately in DOM.
 filled.push(idx);(state.choice.cwUsed||(state.choice.cwUsed=[])).push(id);piece.classList.add('used');piece.classList.remove('selected');slot.classList.add('filled');slot.disabled=true;ill.querySelectorAll('.cw-piece').forEach(b=>b.setAttribute('aria-pressed','false'));cwStatus(ill,`구름 조각 ${filled.length}/3개를 이었어요.`);
 if(filled.length===3){ill.querySelector('.cw-bridge').classList.add('complete');setTimeout(()=>{const b=ill.querySelector('.cw-bridge');if(b)b.classList.add('arrived')},2000);applyChoice('cwBridge','yes',null,0);cwStatus(ill,'구름길이 이어졌어요. 다음 장에서 구름새를 따라가 보세요.');}}
Object.assign(JACT,{
 'cw-path'(a,ill){if(state.busy||ill._cwRouting)return;ill._cwRouting=true;for(const k of ['jrPath','loot','door','hide','egg','escape','chase','descend','chop','ghEnter','ghWater','ghBloom','ghGift','ghShare','ghPods','ghHarvest','ghSeeds','ghShared','cwFilled','cwUsed','cwFound',...CW_KEYS])delete state.choice[k];applyChoice('cwPath',a.dataset.path,null,0);if(a.dataset.path==='castle'){state.choice.door='yes';a.classList.add('open');}dots();setTimeout(()=>{if(ill.isConnected&&!state.busy)go(state.page+1)},850);},
 'cw-piece'(a,ill){if(a._cwSuppress||a.classList.contains('used'))return;const on=!a.classList.contains('selected');ill.querySelectorAll('.cw-piece').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});a.classList.toggle('selected',on);a.setAttribute('aria-pressed',String(on));cwStatus(ill,on?'구름 조각을 놓을 빈자리를 눌러 주세요.':'구름 조각을 골라 주세요.');},
 'cw-slot'(a,ill){const selected=ill.querySelector('.cw-piece.selected');if(selected)cwDrop(ill,selected,a);else cwStatus(ill,'아래의 구름 조각을 먼저 골라 주세요.');},
 'cw-seed'(a,ill){if(a.disabled)return;const found=state.choice.cwFound||(state.choice.cwFound=[]);if(found.includes(+a.dataset.seed))return;found.push(+a.dataset.seed);a.disabled=true;a.classList.add('freed');cwStatus(ill,`씨앗 ${found.length}/3알을 구했어요.`);if(found.length===3){applyChoice('cwSeeds','yes',null,0);cwStatus(ill,'씨앗을 모두 구했어요. 구름새가 집까지 태워 준대요!');}},
 'cw-fly'(a,ill){if(state.choice.cwRide||a.disabled)return;a.disabled=true;ill.querySelector('.cw-sky').classList.add('flying');cwStatus(ill,'구름새와 함께 집으로 날아가는 중이에요.');setTimeout(()=>{if(!ill.isConnected)return;applyChoice('cwRide','yes',null,0);cwStatus(ill,'집이 보여요! 다음 장으로 가 보세요.');},reduced?0:2600);},
 'cw-plant'(a,ill){if(state.choice.cwPlant)return;applyChoice('cwPlant','yes',null,0);cwRefresh();}
});
let cwDrag=null;
document.addEventListener('pointerdown',e=>{const a=e.target.closest('.cw-piece:not(.used)');if(!a)return;const ill=a.closest('.ill');cwDrag={a,ill,x:e.clientX,y:e.clientY,moved:false};a.setPointerCapture(e.pointerId);e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!cwDrag)return;const d=cwDrag,dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.hypot(dx,dy)>6)d.moved=true;if(d.moved){d.a.classList.add('dragging');d.a.style.transform=`translate(${dx}px,${dy}px)`;} });
document.addEventListener('pointerup',e=>{if(!cwDrag)return;const d=cwDrag;cwDrag=null;d.a.classList.remove('dragging');d.a.style.transform='';if(d.moved){d.a._cwSuppress=true;setTimeout(()=>d.a._cwSuppress=false,400);const slot=[...d.ill.querySelectorAll('.cw-slot:not(:disabled)')].find(x=>{const r=x.getBoundingClientRect();return e.clientX>=r.left-12&&e.clientX<=r.right+12&&e.clientY>=r.top-12&&e.clientY<=r.bottom+12});if(slot)cwDrop(d.ill,d.a,slot);else cwStatus(d.ill,'점선으로 표시된 빈자리에 놓아 주세요.');}});
document.addEventListener('pointercancel',()=>{if(cwDrag){cwDrag.a.style.transform='';cwDrag.a.classList.remove('dragging');cwDrag=null;}});

</script>

<script>
const PG_DOORS=[[61,53.5,14,23],[66.7,54.8,14.7,29.6],[69,53.2,13,30]];
/* Three Little Pigs: one complete original-story route. */
const PG_NAMES=['첫째','둘째','셋째'];
const PG_LABELS=['짚','나무','벽돌'];
function pgPig(i,style='',cls=''){const c=CHARS['pig'+(i+1)];const parts=c.parts;style=style.replace(/width:([\d.]+)%/g,(_,w)=>'width:'+(+w*c.w/CHARS.pig1.w)+'%');return `<span class="pg-pig ${cls}" style="${style}" role="img" aria-label="${PG_NAMES[i]} 아기돼지"><img class="pg-body" src="${c.body}" alt="" draggable="false">${parts.map(p=>`<img class="pg-part" src="${p.src}" alt="" draggable="false" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;transform-origin:${p.ox}% ${p.oy}%">`).join('')}</span>`;}
function pgHouse(i,style='',cls=''){return `<img class="pg-house ${cls}" src="${IMG[['pgStrawHouse','pgWoodHouse','pgBrickHouse'][i]]}" alt="${PG_LABELS[i]}집" draggable="false" style="${style}">`;}
function pgWolf(style='',cls=''){return `<img class="pg-wolf ${cls}" src="${IMG.pgWolf}" style="${style}" alt="늑대" draggable="false">`;}
/* Objects are touched where they belong in the story. No separate task boards. */
const PG_HOUSES=['pgStrawHouse','pgWoodHouse','pgBrickHouse'];
function pgHome(i,style='',cls='',open=false){const [x,y,w,h]=PG_DOORS[i];return `<span class="pg-home ${cls}" data-home="${i}" style="${style};--reveal:${['#c9a24f','#c08f58','#c76a50'][i]}">${pgHouse(i)}<span class="pg-door-space ${open?'open':''}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;--leaf:url(${IMG[PG_HOUSES[i]]});--bs:${10000/w}% ${10000/h}%;--bp:${x/(100-w)*100}% ${y/(100-h)*100}%"><span class="pg-door-leaf"></span></span></span>`;}
function pgHint(t){return `<span class="pg-whisper" role="status" aria-live="polite">${t}</span>`;}
function pgDoors(i,style='',action='pg-enter'){return `<button class="pg-door-hit" data-act="${action}" data-home="${i}" style="${style}" aria-label="${PG_LABELS[i]}집 문 열기"></button>`;}
/* ===== 아기돼지 삼형제: 선택에 따라 이야기가 달라지는 루트 ===== */
function pgPicks(key,opts,style){return `<span class="pg-picks" style="${style}">${opts.map(([v,l])=>`<button class="pg-pick" data-act="pg-pick" data-key="${key}" data-v="${v}">${l}</button>`).join('')}</span>`;}
function pgHs(act,style,label,extra=''){return `<button class="hs pg-hs" data-act="${act}" ${extra} style="${style}" aria-label="${label}"></button>`;}
function pgShout(t,style){return `<span class="pg-shout" style="${style}">${t}</span>`;}
function pgOpening(){return `<div class="pg-scene pg-opening">${[0,1,2].map(i=>pgPig(i,`left:${36+i*14}%;bottom:9%;width:11.5%;--delay:${i*.18}s`,'pg-outgoing')).join('')}</div>`;}
/* 1. 첫째: 다 지은 짚집, 문을 눌러 들어가기 */
function pgBuild(){const done=!!state.choice.pgBuild;return `<div class="pg-scene pg-at-home pg-roof-building${done?' entered built':''}"><span class="pg-home pg-build-home" data-home="0" style="left:47%;bottom:-7%;width:49%">${pgHouse(0)}${[0,1].map(n=>`<img class="pg-roof-gap pg-gap-${n}${done?' filled':''}" src="${IMG.pgStrawUnfinished}" alt="" aria-hidden="true"><button class="pg-roof-place pg-place-${n}" data-act="pg-roof-place" data-bay="${n}" aria-label="지붕 빈자리 ${n+1}에 짚단 얹기" ${done?'disabled':''}></button>`).join('')}<span class="pg-build-door${done?' open':''}"></span></span>${pgPig(0,'left:29%;bottom:9%;width:14%;--walk:48cqw','pg-going-in')}${[0,1].map(n=>`<button class="pg-straw-bundle${done?' placed':''}" data-act="pg-pick-bundle" data-bundle="${n}" aria-label="짚단 ${n+1} 집기" aria-pressed="false" style="left:${43+n*12}%;bottom:${3+n*2}%" ${done?'disabled':''}><img src="${IMG.pgStrawBundle}" alt="" draggable="false"></button>`).join('')}${done?'':pgHint('짚단 두 개를 지붕의 빈 곳에 끌어 얹어 주세요.')}</div>`;}

/* 늑대를 누르면 바람이 불어요 (i=0 짚집, i=1 나무집). solo: 둘째 혼자 */
function pgEscape(i,solo){const key=i===0?'pgEscapeStraw':'pgEscapeWood',done=!!state.choice[key];
 const group=i===0?pgPig(0,'position:relative;width:100%'):(solo?pgPig(1,'position:relative;width:100%'):pgPig(0,'position:relative;width:100%')+pgPig(1,'left:82%;bottom:0%;width:100%'));
 const label=i===0?'첫째':(solo?'둘째':'두 형제');
 return `<div class="pg-scene pg-escape pg-solo${done?' blown escaped':''}" data-escape="${i}"><span class="pg-broken-home pg-lone">${pgHome(i,'width:100%;position:relative')}</span><img class="pg-rubble-art pg-lone-rubble" src="${IMG[i===0?'pgStrawRubble':'pgWoodRubble']}" alt="무너진 ${PG_LABELS[i]}집"><span class="pg-wind" aria-hidden="true">${Array.from({length:6},(_,n)=>`<i style="--n:${n}"></i>`).join('')}${Array.from({length:7},(_,n)=>`<b class="pg-bit" style="--n:${n}"></b>`).join('')}</span><button class="pg-wolf-blow" data-act="pg-blow" aria-label="늑대를 눌러 바람 불기">${pgWolf('position:relative;height:auto;width:100%','pg-blowing-wolf')}${done?'':'<span class="hs pg-cue" style="left:80%;top:26%"></span>'}</button><button class="pg-flee-group" data-act="pg-escape" data-from="${i}" aria-label="${label}를 오른쪽으로 달리게 하기">${group}</button>${done?'':pgHint(i===1?'늑대를 눌러 바람을 불어 보세요. 이번엔 한 번으로는 안 무너져요.':'늑대를 눌러 바람을 불어 보세요.')}</div>`;}
/* 3. 둘째: 형을 숨길 곳 고르기 (문 / 길) */
function pgHide(){const v=state.choice.pgHide,done=!!v;return `<div class="pg-scene pg-at-home pg-hide${done?' picked':''}${done&&v==='inside'?' entered':''}" ${done?`data-pick="${v}"`:''}>${pgHome(1,'left:46%;bottom:13%;width:47%','pg-focus-home',done&&v==='inside')}${pgPig(1,'left:40%;bottom:8%;width:12%;--walk:40cqw','pg-going-in pg-p1')}${pgPig(0,'left:22%;bottom:8%;width:13%;--walk:58cqw','pg-going-in pg-p0 pg-arriving')}${done?'':pgHs('pg-pick','left:77.5%;top:63%;width:7%;height:22%','집 안으로 숨기기','data-key="pgHide" data-v="inside"')+pgHs('pg-pick','left:88%;top:70%;width:8%;height:21%','뒷길로 보내기','data-key="pgHide" data-v="back"')}</div>`;}
function pgBrickHome(){const done=!!state.choice.pgBrickDoor;return `<div class="pg-scene pg-brick${done?' secured':''}">${pgHome(2,'left:45%;bottom:10%;width:49%','pg-focus-home',!done)}${[0,1,2].map(i=>pgPig(i,`left:${24+i*12}%;bottom:8%;width:11%;--walk:${56-i*12}cqw`,'pg-going-in')).join('')}${pgWolf('left:2%;bottom:15%;height:32%','pg-distant-wolf')}<button class="pg-close-door" data-act="pg-close" aria-label="삼형제가 들어간 뒤 벽돌집 문 닫기"></button>${done?'':pgHint('문을 눌러 형제들을 안으로 들여보내 주세요.')}</div>`;}
function pgBolt(){const done=!!state.choice.pgBolt;return `<div class="pg-scene pg-interior${done?' bolted':''}"><span class="pg-inside-pigs">${[0,1,2].map(i=>pgNeutral(i,`left:${i*29}%;bottom:0;width:28%`)).join('')}</span><span class="pg-bolt-brackets" aria-hidden="true"><i></i><i></i></span><button class="pg-bolt" data-act="pg-bolt" aria-label="빗장을 오른쪽으로 밀어 문 잠그기"><span></span></button>${done?'':pgHint('문 안쪽의 나무 빗장을 오른쪽으로 밀어 주세요.')}</div>`;}
function pgBrickWind(){return `<div class="pg-scene pg-escape pg-strong-house pg-solo${state.choice.pgWord==='wolf'?' pgw-wolf':''}">${pgHome(2,'left:45%;bottom:10%;width:49%','pg-focus-home')}${state.choice.pgWord==='home'?'<span class="pgw-sign pgw-sign-home" style="animation:none">튼튼한</span>':''}<span class="pg-wind" aria-hidden="true">${Array.from({length:6},(_,n)=>`<i style="--n:${n}"></i>`).join('')}</span><button class="pg-wolf-blow pg-wolf-big" data-act="pg-blow" aria-label="늑대를 눌러 바람 불기">${pgWolf('position:relative;height:auto;width:100%','pg-blowing-wolf')}${state.choice.pgWord==='wolf'?'<span class="pgw-sign pgw-sign-wolf" style="animation:none">튼튼한</span>':''}<span class="hs pg-cue" style="left:80%;top:26%"></span></button><button class="pg-knock" data-act="pg-peek" aria-label="튼튼한 벽돌집 창문 살펴보기"></button><span class="pg-window-peek">${pgPig(2,'position:relative;width:100%')}</span>${pgHint('늑대를 눌러 바람을 불어 보세요.')}</div>`;}
/* 8. 굴뚝에서 달그락: 벽난로의 물솥 / 굴뚝 구멍 중 고르기 (집 안) */

function pgEnding(){const soup=state.choice.pgEnd==='soup';return `<div class="pg-scene pg-ending${soup?' with-wolf':''}">${pgHome(2,'left:52%;bottom:15%;width:39%')}${soup?pgRestWolf('left:22%;bottom:9%;height:31%','pg-friend-wolf')+pgSoupTable('left:40%;bottom:0%;width:20%'):''}${[0,1,2].map(i=>`<button class="pg-end-pig" data-act="pg-cheer" style="left:${soup?60+i*10:14+i*14}%;bottom:8%;width:${soup?11:12}%" aria-label="${PG_NAMES[i]}와 이야기하기">${pgNeutral(i,'position:relative;width:100%')}</button>`).join('')}</div>`;}

 {kind:'scene',img:'pgHearth',ar:2,need:'pgStop',tx:[5,3,39],text:()=>(C.pgWord==='home'?'“튼튼한” 벽돌집은 아무리 불어도 끄떡없었어요. 벽으로는 들어갈 수 없다는 걸 안 늑대는 꾀를 냈어요. 이번에는 천장에서 쿵쿵 소리가 났어요. 하나뿐인 빈틈, 굴뚝으로 들어오려는 거예요! 벽난로에서 검댕이 톡 떨어졌어요.':C.pgWord==='wolf'?'거센 바람에 창문이 덜컹거렸지만 벽돌집은 버텼어요. 숨이 찬 늑대는 다른 길을 찾았어요. 이번에는 천장에서 쿵쿵 소리가 났어요. 늑대가 지붕에 올라간 거예요! 벽난로에서 검댕이 톡 떨어졌어요.':'잠잠해진 줄 알았는데, 이번에는 천장에서 쿵쿵 소리가 났어요. 늑대가 지붕에 올라간 거예요! 벽난로에서 검댕이 톡 떨어졌어요.')+' 삼형제는 물이 든 솥과 굴뚝 안쪽 덮개를 바라보았어요.'+(C.pgStop==='cap'?' <span class="res">삼형제가 덮개를 밀어 닫았어요. 굴뚝 길이 막히자 늑대는 더 들어오지 못하고 지붕에서 내려갔어요.</span>':C.pgStop==='pot'?' <span class="res">솥을 데우자 따뜻한 김이 굴뚝으로 올라갔어요. 내려오던 늑대는 깜짝 놀라 밖으로 물러났어요.</span>':''),fx:pgRoof},

 {kind:'scene',img:'pgBrickYard',ar:2,tx:[5,3,39],text:()=>C.pgEnd==='soup'?'며칠 뒤, 늑대는 약속대로 짚과 나무를 모아 두 형제의 집을 고쳐 주었어요. 일을 마친 뒤에는 벽돌집 마당에서 따뜻한 수프를 나누었지요. 삼형제는 서로 돕는 새 이웃을 얻게 되었답니다.':'늑대가 떠난 뒤 삼형제는 함께 무너진 집들을 고쳤어요. 첫째와 둘째는 셋째에게 튼튼하게 짓는 법을 배웠지요. 각자의 집이 완성될 때까지 세 형제는 벽돌집에서 서로를 돌보며 지냈답니다.',fx:pgEnding},

const pgOriginalPagesFor=pagesFor;
pagesFor=function(id){return id==='pigs'?pagePigs():pgOriginalPagesFor(id);};
const pgOriginalRender=render;
render=function(i){const sp=pgOriginalRender(i);if(state.story==='pigs'){sp.dataset.pgScene=String(i);if(pagePigs()[i].kind==='fin'){const soup=state.choice.pgEnd==='soup';const sub=sp.querySelector('.crsub');if(sub)sub.textContent=soup?'늑대와 친구가 된 벽돌집':'함께 지킨 튼튼한 벽돌집';const pic=sp.querySelector('.finpic');if(pic)pic.style.backgroundImage=`url(${IMG.pgBrickYard})`;const art=sp.querySelector('.finart');if(art)art.insertAdjacentHTML('beforeend',`<div class="pg-fin-art">${pgHome(2,'left:26%;bottom:22%;width:55%')}${soup?pgRestWolf('left:2%;bottom:9%;height:26%',''):''}${[0,1,2].map(n=>pgPig(n,`left:${(soup?24:18)+n*(soup?18:23)}%;bottom:8%;width:${soup?15:18}%`)).join('')}</div>`);}}return sp;};
const pgOldCover=coverHTML;
coverHTML=function(id){return id!=='pigs'?pgOldCover(id):`<div class="cover"><small>나만의 동화</small><div class="oval pg-cover-art">${pgHome(2,'left:19%;bottom:16%;width:65%')}${pgPig(2,'left:38%;bottom:0;width:32%')}</div><h2>아기 돼지 삼형제</h2></div>`;};
function pgLater(ill,fn,ms){setTimeout(()=>{if(ill.isConnected&&state.story==='pigs')fn();},reduced?0:ms);}
function pgDone(key,v,ill,delay=1100){pgLater(ill,()=>{applyChoice(key,v,null,0);const hint=ill.querySelector('.pg-whisper');if(hint)hint.remove();},delay);}
function pgFlee(a,ill){const i=+a.dataset.from,key=i===0?'pgEscapeStraw':'pgEscapeWood';if(state.choice[key]||ill._pgMoving||!ill.querySelector('.pg-escape').classList.contains('blown'))return;ill._pgMoving=true;ill.querySelector('.pg-escape').classList.add('escaped');pgDone(key,'yes',ill,1450);}
function pgSetHint(ill,t){const h=ill.querySelector('.pg-whisper');if(h){h.textContent=t;h.style.animation='none';h.style.opacity=1}}
Object.assign(JACT,{
 'pg-knockdoor'(a,ill){const sc=ill.querySelector('.pg-scene');if(state.choice.pgBuild||ill._pgMoving)return;ill._pgMoving=true;a.style.display='none';const ds=sc.querySelector('.pg-door-space,.pg-build-door');try{creak()}catch(e){}ds.classList.add('open');sc.classList.add('picked','built');pgLater(ill,()=>sc.classList.add('entered'),900);pgDone('pgBuild','yes',ill,2500);},
 'pg-pick'(a,ill){const key=a.dataset.key,v=a.dataset.v;if(state.choice[key]||ill._pgMoving)return;ill._pgMoving=true;const sc=ill.querySelector('.pg-scene');sc.dataset.pick=v;sc.classList.add('picked');ill.querySelectorAll('.pg-hs').forEach(h=>h.style.display='none');try{creak()}catch(e){}
  if(key==='pgHide'){const ds=sc.querySelector('.pg-door-space');if(v==='inside')pgLater(ill,()=>{ds.classList.add('open');sc.classList.add('entered')},500);pgDone(key,v,ill,2600);}
  else if(key==='pgStop'){pgDone(key,v,ill,2600);}
  else if(key==='pgEnd'){const ds=sc.querySelector('.pg-door-space');if(v==='soup')pgLater(ill,()=>ds.classList.add('open'),600);pgDone(key,v,ill,3200);}},
 'pg-blow'(a,ill){const sc=ill.querySelector('.pg-escape,.pg-strong-house');if(!sc||sc.classList.contains('blown'))return;const now=Date.now();if(sc._lb&&now-sc._lb<700)return;sc._lb=now;const cue=a.querySelector('.pg-cue');if(cue)cue.style.display='none';
  sc.classList.remove('gust');void sc.offsetWidth;sc.classList.add('gust');try{windPuff()}catch(e){}
  if(sc.classList.contains('pg-strong-house')){pgSetHint(ill,'후우우—! 벽돌집은 꿈쩍도 하지 않아요. 창문도 눌러 보세요.');return}
  const need=sc.dataset.escape==='1'?2:1;sc.dataset.blows=(+sc.dataset.blows||0)+1;
  if(+sc.dataset.blows<need){sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake');pgSetHint(ill,'집이 덜컹거려요! 한 번 더 불게 해 보세요.');return}
  pgLater(ill,()=>{sc.classList.remove('shake');sc.classList.add('blown');pgSetHint(ill,'집이 무너졌어요! 돼지를 오른쪽으로 끌어서 도망치게 해 주세요.')},700);},
 'pg-bolt'(a,ill){if(state.choice.pgBolt||ill._pgMoving)return;ill._pgMoving=true;ill.querySelector('.pg-interior').classList.add('bolted');pgDone('pgBolt','yes',ill,900);},
 'pg-escape'(a,ill){if(!a._pgSuppress)pgFlee(a,ill);},
 'pg-close'(a,ill){if(state.choice.pgBrickDoor||ill._pgMoving)return;ill._pgMoving=true;ill.querySelector('.pg-brick').classList.add('secured');pgLater(ill,()=>{ill.querySelector('.pg-door-space').classList.remove('open');try{creak()}catch(e){}},1350);pgDone('pgBrickDoor','yes',ill,1900);},
 'pg-peek'(a,ill){ill.querySelector('.pg-window-peek').classList.toggle('show');const h=ill.querySelector('.pg-whisper');if(h)h.remove();},
 'pg-cheer'(a){a.classList.remove('pg-cheering');void a.offsetWidth;a.classList.add('pg-cheering');}

let pgDrag=null;
document.addEventListener('pointerdown',e=>{const a=e.target.closest('.pg-flee-group');if(!a||a.closest('.pg-escape').classList.contains('escaped'))return;pgDrag={a,ill:a.closest('.ill'),x:e.clientX,y:e.clientY,moved:false};a.setPointerCapture(e.pointerId);e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!pgDrag)return;const d=pgDrag,dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.hypot(dx,dy)>6)d.moved=true;if(d.moved)d.a.style.transform=`translate(${Math.max(-25,dx)}px,${Math.max(-25,Math.min(25,dy))}px)`;});
document.addEventListener('pointerup',e=>{if(!pgDrag)return;const d=pgDrag;pgDrag=null;d.a.style.transform='';if(d.moved){d.a._pgSuppress=true;setTimeout(()=>d.a._pgSuppress=false,400);if(e.clientX-d.x>35)pgFlee(d.a,d.ill);}});

let pgObjectDrag=null;

function windPuff(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,len=AC.sampleRate*1.3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);const n=AC.createBufferSource();n.buffer=buf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(500,t);f.frequency.linearRampToValueAtTime(1300,t+.6);f.Q.value=.7;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.25);g.gain.linearRampToValueAtTime(0,t+1.2);n.connect(f);f.connect(g);g.connect(AC.destination);n.start(t);n.stop(t+1.3)}catch(e){}}

// Two physical roof bays. A drop must land on an unfilled bay; clicks and keyboard
// select a sheaf first, then its destination. Partial progress belongs to this page.
function pgBuildData(ill){return ill._pgBuild||(ill._pgBuild={filled:new Set(),selected:null,busy:false});}
function pgChooseBundle(a,ill){const b=pgBuildData(ill);if(a.disabled||b.busy)return;b.selected=a;ill.querySelectorAll('.pg-straw-bundle').forEach(el=>el.setAttribute('aria-pressed',String(el===a)));ill.querySelector('.pg-roof-building').classList.add('selecting');const h=ill.querySelector('.pg-whisper');if(h)h.textContent='지붕의 비어 있는 골조를 눌러 짚을 얹어 주세요.';}
function pgPlaceBundle(a,ill,bundle){const b=pgBuildData(ill),n=+a.dataset.bay;bundle=bundle||b.selected;if(!bundle||bundle.disabled||b.filled.has(n)||b.busy)return;b.filled.add(n);b.selected=null;bundle.disabled=true;bundle.setAttribute('aria-pressed','false');a.disabled=true;const r=bundle.getBoundingClientRect(),t=a.getBoundingClientRect();bundle.style.transform=`translate(${t.x+t.width/2-r.x-r.width/2}px,${t.y+t.height/2-r.y-r.height/2}px) scale(.8) rotate(-12deg)`;bundle.classList.add('snapping');ill.querySelector('.pg-roof-building').classList.remove('selecting');pgLater(ill,()=>{ill.querySelector('.pg-gap-'+n).classList.add('filled');bundle.classList.add('placed');},350);const h=ill.querySelector('.pg-whisper');if(b.filled.size===2){b.busy=true;if(h)h.textContent='지붕 완성! 이제 집에서 쉴 수 있어요.';ill.querySelector('.pg-going-in').classList.add('pg-cheering');pgLater(ill,()=>JACT['pg-knockdoor']({style:{}},ill),1000);}else if(h)h.textContent='잘 얹었어요. 남은 짚단도 빈 지붕에 올려 주세요.';}
JACT['pg-pick-bundle']=(a,ill)=>{if(!a._pgSkipClick)pgChooseBundle(a,ill);};
JACT['pg-roof-place']=(a,ill)=>pgPlaceBundle(a,ill);
let pgRoofDrag=null;

<style id="pg-polish-2">

@keyframes pgFlap{from{rotate:-14deg}to{rotate:10deg}}

<script id="story-plans-js">
/* Presentation previews: planned interactions stay separate from the working story. */
(() => {
  const plans = {
    pgBuild: {
      title: '짚단을 엮어 집 짓기', image: 'img/d7531bcbc3b6.webp', pig: 0,
      intro: '첫째가 집을 지을 수 있도록 짚단을 하나씩 옮겨 주세요.',
      steps: ['짚단을 벽의 빈자리로 끌어 놓아요.', '벽을 채우면 지붕에 짚을 차곡차곡 얹어요.', '집이 완성되면 첫째가 문을 열고 들어가요.'],
      note: '벽 → 지붕 → 입주 순서의 조립 인터랙션을 구현할 예정이에요.'
    },
    pgWoodBuild: {
      title: '나무판을 맞춰 집 짓기', image: 'img/da5b13c32856.webp', pig: 1,
      intro: '둘째와 함께 나무판을 세우고 지붕을 덮어 주세요.',
      steps: ['나무판을 기둥 사이 빈자리에 맞춰요.', '판자가 맞으면 고정되고 벽이 이어져요.', '지붕널과 문까지 붙이면 나무집이 완성돼요.'],
      note: '재료가 놓이는 순서에 따라 집이 실제로 조립되는 모습을 구현할 예정이에요.'
    },
    pgBrickBuild: {
      title: '벽돌을 쌓아 튼튼한 집 짓기', image: 'img/d893fb865eda.webp', pig: 2,
      intro: '셋째를 도와 벽돌을 한 줄씩 엇갈리게 쌓아 주세요.',
      steps: ['벽돌을 아래쪽 빈자리부터 옮겨 놓아요.', '한 줄을 채우면 다음 줄을 쌓을 수 있어요.', '벽과 지붕을 완성하면 삼형제를 지켜 줄 집이 돼요.'],
      note: '한 번에 집이 나타나는 대신 벽돌 → 벽 → 지붕 순서로 완성할 예정이에요.'
    },
    harpTalk: {
      title: '하프와 조용히 이야기하기', image: IMG.k7,
      intro: '잠든 거인 옆에서 하프에게 작은 목소리로 말을 걸어요.',
      steps: ['하프를 눌러 대화를 시작해요.', '잭이 하프에게 조용히 해 달라고 부탁해요.', '대화가 끝나면 하프를 안고 문으로 이동해요.'],
      note: '하프와의 대화는 추가 예정이에요. 현재 체험에서는 잭을 눌러 도망가면 하프가 울리고 거인이 깨어나요.'
    }
  };
  const previousRender = render;
  render = function (index) {
    const spread = previousRender(index);
    const page = pagesFor(state.story)[index];
    const key = state.story === 'pigs' && plans[page?.need] ? page.need :
      state.story === 'jack' && page?.need === 'escape' && state.choice.loot === 'harp' ? 'harpTalk' : null;
    if (!key || !spread.querySelector('.ill')) return spread;
    const spec = plans[key];
    const ill = spread.querySelector('.ill');
    spread.classList.add('has-story-plan');
    spread.dataset.planKey = key;
    const preview = document.createElement('section');
    preview.className = 'story-plan';
    preview.setAttribute('aria-label', spec.title + ' 구현 예정 안내');
    const character = spec.pig !== undefined ?
      pgPig(spec.pig, 'left:43%;bottom:9%;width:10.5%', 'plan-original-pig') :
      jKitchenRest() + `<img class="plan-original-jack" src="${NIMG.jack_harp_harp_stand}" alt="황금 하프를 안은 잭" draggable="false">`;
    preview.innerHTML = `<img class="plan-scene-art" src="${spec.image}" alt="${spec.pig !== undefined ? '벽과 지붕을 조립하는 중인 집의 예상 장면' : '거인의 부엌에서 하프와 대화할 예정인 장면'}" draggable="false">${character}
      <div class="plan-copy"><span class="plan-status">구현 예정 · 기획 이미지</span><h3>${spec.title}</h3><p class="plan-intro">${spec.intro}</p>
      <ol>${spec.steps.map(step => `<li>${step}</li>`).join('')}</ol><p class="plan-note">${spec.note}</p>
      <div class="plan-actions"><button type="button" data-plan-action="experience">현재 체험 보기</button>${key !== 'harpTalk' ? '<button type="button" class="plan-continue" data-plan-action="continue">이야기 계속 →</button>' : ''}</div></div>`;
    ill.appendChild(preview);
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'story-plan-trigger';
    trigger.dataset.planAction = 'preview';
    trigger.textContent = '구현 예정 보기';
    trigger.setAttribute('aria-expanded', String(key !== 'harpTalk'));
    spread.appendChild(trigger);
    spread.classList.toggle('show-story-plan', key !== 'harpTalk');
    preview.hidden = key === 'harpTalk';
    return spread;
  };
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-plan-action]');
    if (!button) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const spread = button.closest('.has-story-plan');
    if (!spread || spread.parentNode !== book || state.busy) return;
    const action = button.dataset.planAction;
    if (action === 'continue') {
      const key = spread.dataset.planKey;
      if (!['pgBuild', 'pgWoodBuild', 'pgBrickBuild'].includes(key)) return;
      applyChoice(key, 'yes', null, 0);
      go(state.page + 1);
      return;
    }
    const show = action === 'preview';
    spread.classList.toggle('show-story-plan', show);
    spread.querySelector('.story-plan').hidden = !show;
    const trigger = spread.querySelector('.story-plan-trigger');
    trigger.setAttribute('aria-expanded', String(show));
    (show ? spread.querySelector('[data-plan-action="experience"]') : trigger).focus({preventScroll:true});
  }, true);
})();

</script>
<script id="text-skip">

<script id="desk-pop-js">
(function(){
const POP=[];
const travel=document.getElementById('travel');
function rel(el,ill){const r=el.getBoundingClientRect(),R=ill.getBoundingClientRect();return {l:(r.left-R.left)/R.width*100,r:(r.right-R.left)/R.width*100,b:(r.bottom-R.top)/R.height*100,h:r.height}}
function prep(ill,def){
  ill.dataset.pop='1';
  def.cards.forEach((sels,ci)=>{
    const els=sels.flatMap(s=>[...ill.querySelectorAll(s)]).filter(e=>!e.closest('.pop-stand')); if(!els.length) return;
    const parent=els[0].parentElement; let foot=0,l=100,r=0;
    els.forEach(e=>{const m=rel(e,ill);if(m.h>2&&!e.classList.contains('hs')){foot=Math.max(foot,m.b);l=Math.min(l,m.l);r=Math.max(r,m.r)}});
    if(!foot) return; foot=Math.min(foot,99.5);
    const a=parent.getBoundingClientRect(),R=ill.getBoundingClientRect(); const pt=(a.top-R.top)/R.height*100, ph=a.height/R.height*100;
    const w=document.createElement('span'); w.className='pop-stand'; w.style.setProperty('--foot',((foot-pt)/ph*100)+'%'); w.style.setProperty('--pd',(ci*.28)+'s');
    parent.insertBefore(w,els[0]); els.forEach(e=>w.appendChild(e));
    const z=Math.max(...els.map(e=>+getComputedStyle(e).zIndex||0)); if(z) w.style.zIndex=z;
    const sh=document.createElement('span'); sh.className='pop-shadow'; sh.style.cssText=`left:${l}%;width:${r-l}%;top:${foot}%;--pd:${ci*.28}s`; ill.appendChild(sh);
  });
  ill.classList.add('pop3d');
}
(function(){let on=false,tapped=false;const card=document.createElement('div');card.className='read-card';card.setAttribute('aria-hidden','true');document.body.appendChild(card);
const set=v=>{if(v===on)return;on=v;travel.classList.toggle('readtext',v);
  if(v){const t=book.querySelector(':scope > .spread .storytext');if(!t){on=false;travel.classList.remove('readtext');return}
    const p=t.querySelector('p')||t;card.innerHTML=p.innerHTML;const cs=getComputedStyle(p);card.style.fontFamily=cs.fontFamily;card.style.fontWeight=cs.fontWeight;card.style.letterSpacing=cs.letterSpacing;card.style.fontSize=Math.max(15,parseFloat(cs.fontSize)*1.02)+'px';card.style.lineHeight='1.7';const r=t.getBoundingClientRect();const W=Math.min(innerWidth-32,Math.max(r.width*1.22,320));
    card.style.width=W+'px';card.style.left=Math.max(16,Math.min(r.left-12,innerWidth-W-16))+'px';card.style.top=Math.max(16,r.top-12)+'px';requestAnimationFrame(()=>card.classList.add('on'))}
  else card.classList.remove('on')};
const hit=(x,y)=>{const t=book.querySelector(':scope > .spread .storytext');if(!t)return false;const r=t.getBoundingClientRect();return x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8};
addEventListener('pointermove',e=>{ if(!travel.classList.contains('popbook')){set(false);return} if(e.pointerType==='touch') return; set(hit(e.clientX,e.clientY)); if(on){const t=book.querySelector(':scope > .spread .storytext p');if(t&&card.innerHTML!==t.innerHTML)card.innerHTML=t.innerHTML} },{passive:true});
addEventListener('pointerdown',e=>{ if(!travel.classList.contains('popbook')){set(false);return} if(e.pointerType==='touch'){ set(hit(e.clientX,e.clientY)&&!on) } },{passive:true,capture:true});
new MutationObserver(()=>set(false)).observe(book,{childList:true});})();
let wait=null;
function check(){
  clearTimeout(wait);
  const sp=book.querySelector(':scope > .spread'); const ill=sp&&sp.querySelector('.ill');
  const def=ill&&POP.find(p=>ill.querySelector(p.when));
  if(!def){travel.classList.remove('popbook');return}
  travel.classList.remove('popbook');
  const go=()=>{ if(state.busy||book.querySelector('.flipper')){wait=setTimeout(go,80);return}
    const cur=book.querySelector(':scope > .spread .ill'); if(cur!==ill) return;
    if(!ill.dataset.pop) prep(ill,def); void travel.offsetWidth; travel.classList.add('popbook'); };
  wait=setTimeout(go,60);
}
new MutationObserver(check).observe(book,{childList:true});
new MutationObserver(()=>{ if(reader.hidden) travel.classList.remove('popbook') }).observe(reader,{attributes:true,attributeFilter:['hidden']});
})();
</script>
